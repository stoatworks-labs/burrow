[package]
name = "burrow"
version = "0.1.2"
description = "Stoatworks Burrow — install, update and remove the Stoatworks video plugins"
authors = ["Allan Sargeant"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
# The `_lib` suffix is not cosmetic: on Windows a library and a binary of the
# same name collide.
name = "burrow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
burrow-core = { path = "../crates/burrow-core" }
burrow-plan = { path = "../crates/burrow-plan" }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
# rustls rather than the system TLS stack, matching sprocket: it keeps macOS and
# Windows behaving identically, and `stream` is what gives byte-level download
# progress rather than a spinner.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
# The demo server. A whole async web framework for six MIME types and one GET
# handler would be more surface than the job needs; tiny_http runs on its own
# thread with no runtime entanglement and is small enough to read.
tiny_http = "0.12"
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
# Standalone: src-tauri is deliberately not a member of the root workspace.
# Tauri's build script and the webkit/objc link steps make a workspace build of
# the pure-Rust library crates slower and platform-dependent for no benefit,
# so this keeps its own lockfile and target directory and depends on them by path.
