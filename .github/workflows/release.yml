name: release

# Build and publish Stoatworks Burrow.
#
# macOS and Windows only, deliberately. DaVinci Resolve does run on Linux and
# OpenFX has a real home there (/usr/OFX/Plugins), but **no plugin in the fleet
# ships a Linux artefact yet** — a Linux Burrow would detect the destination
# correctly and then have nothing at all to install. Add the target the same
# week the first plugin ships one.
#
# Tauri's bundler cannot cross-compile: it shells out to host-only tooling, so
# each platform builds on its own runner. The macOS .dmg and .pkg are built by
# the vendored release-lib.sh rather than by Tauri, whose dmg step drives Finder
# over AppleScript and fails on a headless runner.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust cross-compiles between the two macOS architectures unaided, so
          # both build on the same runner — and the Intel runners are retired.
          - { name: macos-aarch64,  os: macos-14,       target: aarch64-apple-darwin,   bundles: app }
          - { name: macos-x86_64,   os: macos-14,       target: x86_64-apple-darwin,    bundles: app }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: nsis }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: 'src-tauri -> target'

      - name: Derive version
        id: ver
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="$(node -p "require('./package.json').version")" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # What Burrow ships inside itself — the catalogue, every plugin's browser
      # demo and the thumbnails — is **committed**, not gathered here.
      #
      # It has to be. The demos live in two dozen separate plugin repos that a
      # CI checkout cannot see, so a release built from anything but a committed
      # copy would silently ship an app with no demos in it. Vendoring them is
      # also the fleet's existing habit: the support footer and the demo kit are
      # committed into every repo that uses them for the same reason.
      #
      # `scripts/sync-assets.sh` refreshes them, and it is a release step.
      - name: Check the bundled assets are present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin
          # Two locations, because Tauri treats them differently:
          #   src-tauri/assets  is a bundle *resource*, on disk in the .app
          #   public/           is a frontend asset, embedded into the binary
          # The images have to be the second kind — they are addressed as
          # ./thumbs/x.png from the UI. Having them in the wrong one shipped an
          # app with no pictures and nothing failing.
          for required in \
            src-tauri/assets/catalog.json \
            src-tauri/assets/demos \
            public/thumbs \
            public/video
          do
            [ -e "$required" ] || {
              echo "$required is missing — run scripts/sync-assets.sh and commit it" >&2
              exit 1
            }
          done
          entries=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/assets/catalog.json','utf8')).entries.length")
          demos=$(ls src-tauri/assets/demos | wc -l | tr -d ' ')
          thumbs=$(ls public/thumbs | wc -l | tr -d ' ')
          # A catalogue with no entries would tell every copy of Burrow that the
          # fleet is empty, and it would do so silently.
          [ "$entries" -ge 1 ] || { echo "the committed catalogue has no entries" >&2; exit 1; }
          [ "$demos"   -ge 1 ] || { echo "no demos are committed" >&2; exit 1; }
          echo "baked: $entries plugins, $demos demos, $thumbs thumbnails"

      - name: Build the privileged helper
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | awk '/^host:/ {print $2}')"
          cargo build --release -p burrow-helper --target ${{ matrix.target }}
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/burrow-helper$ext" \
             "src-tauri/bin/burrow-helper-${{ matrix.target }}$ext"

      - name: Test
        shell: bash
        run: cargo test --workspace

      - name: Build
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx --no-install tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # With an embedded catalogue, demos and two binaries, the x86_64
      # cross-compile leaves both host and target artefacts in the target
      # directory and hdiutil has run out of space on this shape of build
      # before. The bundle is already built by this point.
      - name: Reclaim disk before packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target="src-tauri/target/${{ matrix.target }}/release"
          rm -rf "$target/build" "$target/deps" "$target/incremental" "$target/.fingerprint"
          df -h / | tail -1

      - name: Installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # Ad-hoc signing first, and the whole bundle re-signed after staging:
        # `tauri build` signs before the bundler places Contents/Resources, so
        # the signature it leaves does not cover the catalogue or the demos.
        # A locally built copy still launches — Gatekeeper only assesses
        # quarantined bundles — so this failure would first appear on a user's
        # machine, after a download.
        run: |
          set -euo pipefail
          source scripts/release-lib.sh
          rl_init "Stoatworks Burrow" burrow "${{ steps.ver.outputs.version }}" \
            com.stoatworkslabs.burrow "$GITHUB_WORKSPACE"
          appdir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          app="Stoatworks Burrow.app"
          [ -d "$appdir/$app" ] || { echo "no .app produced" >&2; exit 1; }

          stage="$RUNNER_TEMP/stage-mac"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R "$appdir/$app" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || true

          # The sidecar is a separate Mach-O and has to be signed before the
          # bundle that seals it.
          codesign --force --sign - --timestamp=none "$stage/$app/Contents/MacOS/burrow-helper"
          rl_adhoc_sign "$stage/$app"

          rl_dmg "${{ matrix.name }}" "$stage" --app "$app"
          rl_pkg "${{ matrix.name }}" "$stage" --app "$app"

      # What an in-app update actually replaces this app with.
      #
      # ⚠️ Built here, from the **staged and re-signed** copy — deliberately
      # not by Tauri's own `createUpdaterArtifacts`, which tars the bundle as
      # the bundler left it. That copy carries the stale signature the step
      # above exists to repair, so every update would ship the exact defect
      # this workflow already fixes for the .dmg and .pkg, and it would only
      # ever show up on somebody else's machine. See docs/NOTES.md, 2026-08-24.
      - name: Updater artefact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not set." >&2
            echo "Every copy of Burrow verifies an update against the key baked" >&2
            echo "into it, so an unsigned release is one nobody can install." >&2
            exit 1
          }
          stage="$RUNNER_TEMP/stage-mac"
          out="burrow-${{ steps.ver.outputs.version }}-${{ matrix.name }}.app.tar.gz"

          # COPYFILE_DISABLE, or bsdtar writes an AppleDouble `._` file beside
          # every entry and the extracted bundle is littered with them.
          COPYFILE_DISABLE=1 tar -C "$stage" -czf "$out" "Stoatworks Burrow.app"
          npx --no-install tauri signer sign "$out"
          [ -s "$out.sig" ] || { echo "no signature was written" >&2; exit 1; }

      # The Windows update *is* the installer: Tauri runs it and it replaces
      # what is there. Signed here rather than by `createUpdaterArtifacts` for
      # one reason only — so that `tauri build` needs no signing key, and a
      # local build with `scripts/build-app.sh` keeps working with none.
      - name: Updater artefact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not set — see the macOS step" >&2
            exit 1
          }
          setup=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" \
            -name '*-setup.exe' | head -1)
          [ -n "$setup" ] || { echo "no NSIS installer produced" >&2; exit 1; }
          npx --no-install tauri signer sign "$setup"
          [ -s "$setup.sig" ] || { echo "no signature was written" >&2; exit 1; }

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p out
          find "src-tauri/target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.sig' \) -exec cp {} out/ \; 2>/dev/null || true
          cp *.dmg *.pkg out/ 2>/dev/null || true
          # The macOS updater tarball and its signature.
          cp *.app.tar.gz *.app.tar.gz.sig out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: burrow-${{ matrix.name }}
          path: out/*
          if-no-files-found: warn

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # The checkout is for scripts/make-latest-json.mjs, below.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            An optional desktop client for the Stoatworks software. Shows every
            plugin, tool and Companion module, what you have installed and what
            has an update, and installs each one in whichever formats you use —
            under Video, Audio, and Networking & Infrastructure.

            Using it is entirely optional — everything in it is still a normal
            download from its own release page.

            **macOS** — `.dmg` to drag it across, or `.pkg` to install it. Both
            architectures.

            **Windows** — `-setup.exe`, x86_64. FFGL plugins for Resolume,
            applications, VST3 plugins and Companion modules install normally;
            OpenFX and After Effects installs are not supported on Windows in
            this release and Burrow says so rather than half-working.

            **No Linux build yet.** Resolve runs on Linux and OpenFX has a home
            there, but no plugin in the fleet ships a Linux artefact — so a Linux
            Burrow would have nothing to install. It will arrive with the first
            plugin that does.

            ---

            **What has not been tested:** nothing has yet been installed into a
            running Resolume, Resolve, After Effects or DAW *through the app*, no
            application into a real Applications folder, and no module into a real
            Companion. The install path is verified against real downloads and
            against temporary folders — including a real disk image, mounted,
            installed and removed again — but the last step is not. Try it
            somewhere a broken plugin folder would cost you nothing, and please
            [report anything that
            misbehaves](https://github.com/stoatworks-labs/burrow/issues).

            The [user guide](https://stoatworks-labs.com/software/burrow/guide)
            covers what it does, what it sends (almost nothing), and why OpenFX
            installs ask for a password.
          generate_release_notes: true

      # The update manifest, published *after* the release so it can carry the
      # release's own notes — which is what the app shows before asking whether
      # to install.
      #
      # It is attached to the release rather than served from the website on
      # purpose: the endpoint is the `/releases/latest/download/` alias, so the
      # thing that decides what an installed Burrow is offered is the same
      # thing that publishes the artefacts. A website deploy cannot change it,
      # and there is no second place to remember to update.
      - name: Publish the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body -q .body > release-body.md
          # ⚠️ The names GitHub gave the assets, not the ones we uploaded.
          # A space becomes a dot on upload, so a URL built from the local
          # filename 404s — which is what v0.2.3 shipped, for Windows only.
          GH_ASSET_NAMES="$(gh release view "$TAG" --json assets -q '.assets[].name')" \
            node scripts/make-latest-json.mjs "$TAG" artifacts release-body.md > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber

      # What this proves is not that the manifest parses — it is that an
      # installed copy can actually reach it. The endpoint compiled into every
      # Burrow is the `/latest/` alias, and that alias points at whichever
      # release GitHub considers newest, which is not necessarily this one:
      # an asset-only tag published as a full release would take it. Ask the
      # real URL rather than assuming the upload settled the question.
      - name: Check an installed copy would find it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url=https://github.com/stoatworks-labs/burrow/releases/latest/download/latest.json
          # That alias lags the upload by up to a minute, so a check the instant
          # the upload returns can read the release before this one. Measured at
          # ~60s on 2026-08-25; this waits rather than guessing.
          want="${TAG#v}"
          for attempt in $(seq 1 12); do
            served=$(curl -fsSL "$url?cb=$RANDOM" || true)
            got=$(printf '%s' "$served" | node -e 'try{process.stdout.write(String(JSON.parse(require("fs").readFileSync(0,"utf8")).version))}catch{process.stdout.write("")}')
            [ "$got" = "$want" ] && break
            echo "  alias serves '$got', waiting for '$want' (attempt $attempt)"
            sleep 15
          done
          [ "$got" = "$want" ] || {
            echo "the /latest/ alias still serves '$got', not '$want' — a newer" >&2
            echo "release, or a prerelease published as a full one, is on top." >&2
            exit 1
          }

          # Every platform present, and — the part v0.2.3 taught us — every URL
          # it names actually resolving. A manifest can be perfectly well formed
          # and still hand one platform a 404, which nobody discovers until
          # somebody on that platform presses the button.
          printf '%s' "$served" | node -e '
            const m = JSON.parse(require("fs").readFileSync(0, "utf8"))
            const keys = Object.keys(m.platforms ?? {})
            for (const k of ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"]) {
              if (!keys.includes(k)) { console.error(`no ${k} in the manifest`); process.exit(1) }
            }
            console.log(keys.map(k => `${k} ${m.platforms[k].url}`).join("\n"))
          ' > urls.txt
          cat urls.txt
          while read -r key u; do
            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$u")
            echo "  $key -> HTTP $code"
            [ "$code" = "200" ] || { echo "$key's update URL does not resolve" >&2; exit 1; }
          done < urls.txt
          echo "ok — $want, all three platforms, all URLs resolve"
