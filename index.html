<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stoatworks Burrow</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      The shared Stoatworks support footer.

      Vendored from stoatworks-backend/support-footer by
      scripts/sync-support-footer.sh — edit it there and re-run the sync, never
      here.

      A classic script with `defer`, NOT type="module": it reads its
      configuration off `document.currentScript`, which is null inside a module,
      and the whole footer silently fails to configure itself.

      `data-version` is substituted at build time by the vite plugin in
      vite.config.ts. Vite's `define` does not reach index.html.
    -->
    <script
      src="./support-footer.js"
      defer
      data-app="Stoatworks Burrow"
      data-repo="https://github.com/stoatworks-labs/burrow"
      data-version="__APP_VERSION__"
      data-project="burrow"
      data-note="Installs and updates the Stoatworks plugins, tools and Companion modules. It fetches one list from this site and downloads from GitHub, and sends nothing else anywhere."
    ></script>
  </body>
</html>
